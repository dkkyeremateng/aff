# The factory's own gate for this repository.
timeout_seconds: 600
memory_mb: 2048
network: none
commands:
  - go build ./...
  - go vet ./...
  - gofmt -l .
  # This repository ships tests that its own gate never ran, so a change could
  # break them and still verify. Every factory change here is now held to them.
  - go test ./...
